<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dispatch Console — Mini Content Scheduler</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #0B0E11;
    --panel: #12161B;
    --panel-raised: #161B21;
    --border: #232A32;
    --border-bright: #323C47;
    --text: #E8ECEF;
    --text-muted: #6B7680;
    --text-dim: #454E58;
    --accent: #4FC3F7;
    --pending: #E8A33D;
    --queued: #4FC3F7;
    --published: #3DD68C;
    --failed: #E85D5D;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html { color-scheme: dark; }

  body {
    margin: 0;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(79,195,247,0.05), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(61,214,140,0.04), transparent 40%);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  a { color: inherit; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(18,22,27,0.7);
    backdrop-filter: blur(8px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--published));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    color: #0B0E11;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }

  .brand-title {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .brand-sub {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }

  .conn {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .conn-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--text-dim);
    box-shadow: none;
    transition: all 0.3s ease;
  }

  .conn-dot.live {
    background: var(--published);
    box-shadow: 0 0 0 3px rgba(61,214,140,0.15);
    animation: pulse 2.2s ease-in-out infinite;
  }

  .conn-dot.down {
    background: var(--failed);
    box-shadow: 0 0 0 3px rgba(232,93,93,0.15);
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(61,214,140,0.15); }
    50% { box-shadow: 0 0 0 6px rgba(61,214,140,0.06); }
  }

  .layout {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 1px;
    background: var(--border);
    max-width: 1280px;
    margin: 0 auto;
  }

  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--bg);
    padding: 24px;
  }

  .section-eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-eyebrow::before {
    content: '';
    width: 3px;
    height: 12px;
    background: var(--accent);
    display: inline-block;
    border-radius: 1px;
  }

  label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    margin: 16px 0 6px;
  }

  label:first-of-type { margin-top: 0; }

  input, select, textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: var(--sans);
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
  }

  textarea {
    resize: vertical;
    min-height: 72px;
    font-family: var(--sans);
  }

  select { cursor: pointer; }

  .btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px 16px;
    background: var(--accent);
    color: #0B0E11;
    border: none;
    border-radius: 6px;
    font-family: var(--mono);
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }

  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .tenant-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .tenant-row input { flex: 1; }

  .status-msg {
    margin-top: 12px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.02em;
    min-height: 16px;
  }

  .status-msg.ok { color: var(--published); }
  .status-msg.err { color: var(--failed); }

  .feed-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .feed-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }

  .feed-count strong { color: var(--text); }

  .cache-tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 4px;
    border: 1px solid var(--border-bright);
    color: var(--text-muted);
  }

  .cache-tag.hit { color: var(--accent); border-color: rgba(79,195,247,0.3); }

  .empty {
    padding: 48px 20px;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 12.5px;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }

  .post {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 10px;
    transition: border-color 0.2s ease;
  }

  .post:hover { border-color: var(--border-bright); }

  .post-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 12px;
  }

  .post-platform {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .platform-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  .post-time {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .post-content {
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 14px;
    word-break: break-word;
  }

  /* the signature element: literal status rail */
  .rail {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .rail-step {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .rail-node {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border-bright);
    flex-shrink: 0;
    transition: all 0.3s ease;
  }

  .rail-line {
    width: 28px;
    height: 1px;
    background: var(--border-bright);
    margin: 0 2px;
  }

  .rail-step.active { color: var(--text); }
  .rail-step.active .rail-node { background: var(--accent); box-shadow: 0 0 0 3px rgba(79,195,247,0.15); }
  .rail-line.active { background: var(--accent); }

  .rail-step.done .rail-node { background: var(--text-muted); }
  .rail-line.done { background: var(--text-muted); }

  .rail-step.published .rail-node { background: var(--published); box-shadow: 0 0 0 3px rgba(61,214,140,0.15); }
  .rail-step.published { color: var(--published); }
  .rail-line.published { background: var(--published); }

  .rail-step.failed .rail-node { background: var(--failed); box-shadow: 0 0 0 3px rgba(232,93,93,0.15); }
  .rail-step.failed { color: var(--failed); }
  .rail-line.failed { background: var(--failed); }

  .fail-reason {
    margin-top: 10px;
    padding: 8px 10px;
    background: rgba(232,93,93,0.08);
    border: 1px solid rgba(232,93,93,0.2);
    border-radius: 5px;
    font-family: var(--mono);
    font-size: 11px;
    color: #F0A5A5;
  }

  footer {
    max-width: 1280px;
    margin: 0 auto;
    padding: 20px 28px 40px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">DC</div>
    <div class="brand-text">
      <div class="brand-title">Dispatch Console</div>
      <div class="brand-sub">Mini Content Scheduler</div>
    </div>
  </div>
  <div class="conn">
    <span class="conn-dot" id="connDot"></span>
    <span id="connLabel">Connecting…</span>
  </div>
</div>

<div class="layout">
  <div class="panel">
    <div class="section-eyebrow">Compose</div>

    <label for="tenantId">Tenant ID</label>
    <div class="tenant-row">
      <input id="tenantId" type="text" value="11111111-1111-1111-1111-111111111111" />
    </div>

    <label for="platform">Platform</label>
    <select id="platform">
      <option value="twitter">Twitter / X</option>
      <option value="instagram">Instagram</option>
      <option value="linkedin">LinkedIn</option>
      <option value="facebook">Facebook</option>
    </select>

    <label for="scheduledAt">Scheduled at</label>
    <input id="scheduledAt" type="datetime-local" />

    <label for="content">Content</label>
    <textarea id="content" placeholder="What do you want to publish?"></textarea>

    <button class="btn" id="submitBtn">Schedule post</button>
    <div class="status-msg" id="formStatus"></div>
  </div>

  <div class="panel">
    <div class="feed-header">
      <div class="section-eyebrow" style="margin-bottom:0">Feed</div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="feed-count"><strong id="postCount">0</strong> posts</span>
        <span class="cache-tag" id="cacheTag">—</span>
      </div>
    </div>
    <div id="feed"><div class="empty">Loading posts…</div></div>
  </div>
</div>

<footer>Polling every 4s · source data served from Redis cache or Postgres, tagged above</footer>

<script>
  const API_BASE = '';
  const POLL_MS = 4000;

  const el = {
    tenantId: document.getElementById('tenantId'),
    platform: document.getElementById('platform'),
    scheduledAt: document.getElementById('scheduledAt'),
    content: document.getElementById('content'),
    submitBtn: document.getElementById('submitBtn'),
    formStatus: document.getElementById('formStatus'),
    feed: document.getElementById('feed'),
    postCount: document.getElementById('postCount'),
    cacheTag: document.getElementById('cacheTag'),
    connDot: document.getElementById('connDot'),
    connLabel: document.getElementById('connLabel'),
  };

  // default scheduledAt to "now" so a fresh post is immediately due
  function setDefaultSchedule() {
    const d = new Date();
    d.setSeconds(0, 0);
    const pad = n => String(n).padStart(2, '0');
    const local = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    el.scheduledAt.value = local;
  }
  setDefaultSchedule();

  const STEPS = ['PENDING', 'QUEUED', 'PUBLISHED'];

  function timeAgo(iso) {
    const diff = Math.max(0, Date.now() - new Date(iso).getTime());
    const s = Math.floor(diff / 1000);
    if (s < 60) return `${s}s ago`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    return `${Math.floor(h/24)}d ago`;
  }

  function renderRail(status) {
    const failed = status === 'FAILED';
    const activeIndex = failed ? 1 : STEPS.indexOf(status); // FAILED branches off after QUEUED

    let html = '<div class="rail">';
    STEPS.forEach((step, i) => {
      let stateClass = '';
      if (failed) {
        stateClass = i <= 1 ? 'done' : '';
      } else if (i < activeIndex) {
        stateClass = 'done';
      } else if (i === activeIndex) {
        stateClass = step === 'PUBLISHED' ? 'published' : 'active';
      }
      html += `<div class="rail-step ${stateClass}"><span class="rail-node"></span>${step}</div>`;
      if (i < STEPS.length - 1) {
        const lineClass = failed ? (i === 0 ? 'done' : '') : (i < activeIndex ? 'done' : '');
        html += `<div class="rail-line ${lineClass}"></div>`;
      }
    });
    if (failed) {
      html = html.replace('PUBLISHED</div>', 'PUBLISHED</div>')
        .replace('<div class="rail">', '<div class="rail">')
        + '<div class="rail-line failed"></div><div class="rail-step failed"><span class="rail-node"></span>FAILED</div>';
    }
    html += '</div>';
    return html;
  }

  function renderPost(p) {
    const failBlock = p.status === 'FAILED' && p.failure_reason
      ? `<div class="fail-reason">⚠ ${escapeHtml(p.failure_reason)}</div>`
      : '';
    return `
      <div class="post">
        <div class="post-top">
          <div class="post-platform"><span class="platform-dot"></span>${escapeHtml(p.platform)}</div>
          <div class="post-time" title="${p.scheduled_at}">scheduled ${timeAgo(p.scheduled_at)}</div>
        </div>
        <div class="post-content">${escapeHtml(p.content)}</div>
        ${renderRail(p.status)}
        ${failBlock}
      </div>
    `;
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str ?? '';
    return d.innerHTML;
  }

  async function refreshFeed() {
    const tenantId = el.tenantId.value.trim();
    if (!tenantId) return;
    try {
      const res = await fetch(`${API_BASE}/posts?tenantId=${encodeURIComponent(tenantId)}`);
      if (!res.ok) throw new Error('bad response');
      const data = await res.json();
      setConn(true);

      el.cacheTag.textContent = data.source === 'cache' ? 'redis cache' : 'postgres';
      el.cacheTag.className = 'cache-tag' + (data.source === 'cache' ? ' hit' : '');
      el.postCount.textContent = data.posts.length;

      if (data.posts.length === 0) {
        el.feed.innerHTML = '<div class="empty">No posts yet for this tenant.<br>Schedule one on the left to get started.</div>';
        return;
      }
      el.feed.innerHTML = data.posts.map(renderPost).join('');
    } catch (err) {
      setConn(false);
    }
  }

  function setConn(isUp) {
    el.connDot.className = 'conn-dot ' + (isUp ? 'live' : 'down');
    el.connLabel.textContent = isUp ? 'Live' : 'Disconnected';
  }

  el.submitBtn.addEventListener('click', async () => {
    const tenantId = el.tenantId.value.trim();
    const content = el.content.value.trim();
    const platform = el.platform.value;
    const scheduledAtLocal = el.scheduledAt.value;

    if (!tenantId || !content || !scheduledAtLocal) {
      el.formStatus.textContent = 'Fill in tenant, content, and schedule time.';
      el.formStatus.className = 'status-msg err';
      return;
    }

    el.submitBtn.disabled = true;
    el.formStatus.textContent = 'Scheduling…';
    el.formStatus.className = 'status-msg';

    try {
      const scheduledAt = new Date(scheduledAtLocal).toISOString();
      const res = await fetch(`${API_BASE}/posts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tenantId, content, platform, scheduledAt }),
      });
      if (!res.ok) throw new Error('failed');
      el.content.value = '';
      el.formStatus.textContent = 'Post scheduled.';
      el.formStatus.className = 'status-msg ok';
      setDefaultSchedule();
      refreshFeed();
    } catch (err) {
      el.formStatus.textContent = 'Could not schedule post — check the API is running.';
      el.formStatus.className = 'status-msg err';
    } finally {
      el.submitBtn.disabled = false;
    }
  });

  el.tenantId.addEventListener('change', refreshFeed);

  refreshFeed();
  setInterval(refreshFeed, POLL_MS);
</script>

</body>
</html>
